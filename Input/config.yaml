General: 
  nTimesteps: 24 # number of timesteps per representative day
  nReprDays: 8 # days
  nDays: 365 # days
  nYears: 3 # years
  totConsumers: 1000000 #  1 million consumers
  Beta: 0 # 10^-3 GW/€

ADMM:
 rho_EOM: 1 # rho ADMM penalty term, EOM (10^3 €/GWh)
 max_iter: 1000 # maximum number of iterations
 epsilon: 0.1 # stopping criterion - tolerance on "accuracy" with which the coupling constraints are satisfied. Applied to dual and primal residuals.
 CircularBufferSize: 2 # number of iterations for which data will be retained, should be at least 2 and less than max_iter

cfd: 
  lambda_cfd: 100 # 10^3 €/GWh
  rho_cfd: 1 #rho penalty term, cfd (10^3 €/GWh)
  epsilon_cfd: 1 # stopping criterion - tolerance on "accuracy" with which the coupling constraints are satisfied. Applied to dual and primal residuals.

Consumers: # Set of representative consumers
  TypeA:
   Share: 0.25 # Share of consumers in overall consumer mix
   PV_cap: 0.000003 #GWp 0.003 MWp 
   D: "CONS_LOW" # Demand timeseries that needs to be picked up
   PV_AF: "SOLAR_SOUTH" # AF solar timeseries that needs to be picked up
   WTP: 5000 # (10^3 €/GWh) 5000 (€/MWh)
   Battery:
    cap_smax: 0.000002 # GW (2 kW)
    EC: 0.9
    ED: 0.9
    Decay: 0.9999
    winj: 0.000002 # GW 2kW
    wwith: 0.000002 # GW 2kW

  TypeB: 
   Share: 0.5  # Share of consumers in overall consumer mix
   PV_cap: 0.000002 # GWp 0.005 MWp 
   D: "CONS_HIGH" # Timeseries that needs to be picked up
   PV_AF: "SOLAR_WEST" # AF solar timeseries that needs to be picked up
   WTP: 2500 # 10^3 €/GW 250 €/MWh
   Battery:
    cap_smax: 0.000001 # GW (1 kW)
    EC: 0.9
    ED: 0.9
    Decay: 0.9999
    winj: 0.000002 # GW 2kW
    wwith: 0.000002 # GW 2kW

  TypeC: 
   Share: 0.25  # Share of consumers in overall consumer mix
   PV_cap: 0.000001 # GWp # 0.001 MWp 
   D: "CONS_HIGH" # Timeseries that needs to be picked up
   PV_AF: "SOLAR_WEST" # AF solar timeseries that needs to be picked up
   WTP: 1000 # 10^3 €/GWh (100 €/MWh)
   Battery:
    cap_smax: 0.000001 # GW (1 kW)
    EC: 0.9
    ED: 0.9
    Decay: 0.9999
    winj: 0.000002 # GW 2kW
    wwith: 0.000002 # GW 2kW

Generators:
# OPEX are parametrized as a/2 x g^2 + b x g 
  Baseload:
    a: 0.008 # (10^3€/GWh)^2 (0.008 (€/MWh)^2)
    b: 10 # 10^3 €/GWh, 10 €/MWh
    C: 5 # GW (5000 MW)

  MidMerit:
    a: 0.032 # 10^3 (€/GWh)^2 (0.032 €/MWh^2)
    b: 40 # €/GWh (40 €/MWh)
    C: 10 # GW (5000 MW)

  Peak:
    a: 0.08 # (10^3€/GWh)^2 0.08 (€/MWh)^2
    b: 200 # (10^3€/GWh) (200 €/MWh)
    C: 10 # GW (5000 MW)
  
  WindOnshore:
    a: 0 # (10^3€/GWh)^2 (€/MWh)^2
    b: 0 # €/GWh ,€/MWh
    C: 5 # GW (5000 MW)
    AF: "WIND_ONSHORE"
  
  WindOffshore:
    a: 0 # (10^3€/GWh)^2 (€/MWh)^2
    b: 0 # €/GWh ,€/MWh
    C: 5 # GW (5000 MW)
    AF: "WIND_OFFSHORE"
  
  SolarPanels:
    a: 0 # (10^3€/GWh)^2 (€/MWh)^2
    b: 0 # 10^3 €/GWh, €/MWh
    C: 5 #GW (5000 MW)
    AF: "SOLAR_SOUTH"